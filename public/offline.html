<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Social Circle · Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f5f4f0; color: #232633; padding: 24px; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #12141c; color: #f5f4f0; } }
      .ring { width: 72px; height: 72px; border-radius: 50%; border: 3px solid currentColor; opacity: .35; margin: 0 auto 8px; display: grid; place-items: center; }
      .ring::after { content: ""; width: 28px; height: 28px; border-radius: 50%; background: #e8f542; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; opacity: .7; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; background: #232633; color: #f5f4f0; font-size: 15px; }
      @media (prefers-color-scheme: dark) { button { background: #f5f4f0; color: #232633; } }
    </style>
  </head>
  <body>
    <main>
      <div class="ring"></div>
      <h1>Nuk ka lidhje / You're offline</h1>
      <p>Social Circle needs a connection to show what's on tonight.<br />Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
